#
# English (British). MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Tags such as <time> or <player> are filled in automatically. An empty message ("") is not sent.
# /skylease about and the console banner are not here; they are fixed credits.
# Anything missing from this file falls back to the bundled English text.

# Do not change. Used to add new messages when you update.
config-version: 1

prefix: "<dark_gray>[<aqua>Skylease</aqua>]</dark_gray>"
error-prefix: "<dark_gray>[<red>Skylease</red>]</dark_gray>"
success-prefix: "<dark_gray>[<green>Skylease</green>]</dark_gray>"
warning-prefix: "<dark_gray>[<yellow>Skylease</yellow>]</dark_gray>"

general:
  no-permission: "<error-prefix> <red>You do not have permission to do that."
  players-only: "Only players can use this command."
  database-error: "<error-prefix> <red>Your data could not be read. Please tell an administrator."
  player-never-joined: "<error-prefix> <red>There is no record of <yellow><player></yellow> on this server."
  time-help: "<prefix> <gray>Valid formats: <yellow>30s, 5m, 2h, 1d, 1mo, 1y</yellow>, or combined, such as <yellow>1h30m</yellow>."
  config-reloaded: "<success-prefix> <green>Configuration reloaded."
  reload-failed: "<error-prefix> <red>The configuration could not be reloaded. Check the console."
  world-not-allowed: "<error-prefix> <red>You cannot fly in this world. Your flight has been switched off."

# Shown instead of the time when the player has unlimited flight.
time:
  unlimited: "∞"

fly:
  enabled: "<success-prefix> <green>Flight enabled. You have <yellow><time></yellow> left."
  disabled: "<warning-prefix> <yellow>Flight disabled."
  creative: "<warning-prefix> <yellow>You can already fly in this game mode."
  unlimited: "<success-prefix> <green>Flight enabled. Your time is unlimited."
  no-time: "<error-prefix> <red>You have no flight time left."
  no-time-shop: "<prefix> <click:run_command:'/fly shop'><hover:show_text:'See how to get more time'><gold>Click to see how to get more.</gold></hover></click>"
  time-depleted: "<error-prefix> <red>Your flight time has run out."
  invalid-args: "<error-prefix> <red>Usage: <yellow>/fly [settings|shop]</yellow>"
  world-blocked: "<error-prefix> <red>You cannot fly in this world."
  region-blocked: "<error-prefix> <red>You cannot fly in this area."
  region-entered: "<warning-prefix> <yellow>Flight is not allowed in this area. You will glide gently down."
  cooldown-active: "<error-prefix> <red>Wait <yellow><seconds>s</yellow> before enabling flight again."
  soft-landing-start: "<warning-prefix> <gold>Your time has run out. <yellow>You will glide gently to the ground."
  soft-landing-complete: "<success-prefix> <green>You have landed."

# Shown by /fly shop. Replace it with your own store details.
shop:
  lines:
    - "<prefix> <gray>To get more flight time, ask the server team."
    - "<gray>An administrator can add it to your account with <yellow>/flyadmin add</yellow>."

alerts:
  low-time: "<warning-prefix> <gold>You have <yellow><time></yellow> of flight left."
  very-low-time: "<error-prefix> <red>Only <yellow><time></yellow> of flight left."

admin:
  usage:
    - "<prefix> <aqua>Administration commands</aqua>"
    - '<yellow>/flyadmin add \<player> \<time></yellow> <gray>- adds time'
    - '<yellow>/flyadmin remove \<player> [time]</yellow> <gray>- takes time away; with no amount, removes it all'
    - '<yellow>/flyadmin info \<player></yellow> <gray>- shows their data'
    - "<yellow>/flyadmin reload</yellow> <gray>- reloads the configuration"
    - "<yellow>/flyadmin debug on|off</yellow> <gray>- switches debug mode on or off"
  usage-add: '<error-prefix> <red>Usage: <yellow>/flyadmin add \<player> \<time></yellow>'
  usage-remove: '<error-prefix> <red>Usage: <yellow>/flyadmin remove \<player> [time]</yellow>'
  usage-info: '<error-prefix> <red>Usage: <yellow>/flyadmin info \<player></yellow>'
  invalid-arg: "<error-prefix> <red>Unknown subcommand: <yellow><arg></yellow>"
  invalid-time: "<error-prefix> <red>Invalid time: <yellow><time></yellow>"
  cannot-remove-unlimited: "<error-prefix> <red><aqua><player></aqua> has unlimited flight, so time cannot be taken away."
  player-offline-note: "<warning-prefix> <yellow><player></yellow> is offline. The change has been saved."

  time-added: "<success-prefix> <green>Added <yellow><time></yellow> to <aqua><player></aqua>."
  time-added-notify: "<success-prefix> <green>You received <yellow><time></yellow> of flight time."
  time-added-notify-admin: "<prefix> <aqua><admin></aqua> <gray>gave you <yellow><time></yellow> of flight time."
  time-removed: "<success-prefix> <yellow>Took <red><time></red> from <aqua><player></aqua>."
  time-removed-notify: "<prefix> <gray><red><time></red> of flight time was taken from you."
  time-removed-notify-admin: "<prefix> <aqua><admin></aqua> <gray>took <red><time></red> of flight time from you."
  all-time-removed: "<success-prefix> <yellow>Removed all flight time from <aqua><player></aqua>."
  all-time-removed-notify: "<error-prefix> <red>All your flight time was removed."
  all-time-removed-notify-admin: "<error-prefix> <aqua><admin></aqua> <red>removed all your flight time."

  status-flying: "<green>Flying"
  status-grounded: "<gray>On the ground"
  player-info:
    - "<prefix> <aqua>Data for <bold><player></bold></aqua>"
    - "<gray>Time left: <yellow><time>"
    - "<gray>Status: <status>"
    - "<gray>Particle effect: <light_purple><effect>"
    - "<gray>Alerts enabled: <yellow><alerts>/<max_alerts>"
    - "<gray>UUID: <dark_gray><uuid>"
    - "<gray>Last seen: <yellow><last_seen>"

debug:
  enabled: "<success-prefix> <green>Debug mode enabled. Details go to the console."
  disabled: "<success-prefix> <green>Debug mode disabled."
  invalid-arg: "<error-prefix> <red>Usage: <yellow>/flyadmin debug on|off</yellow>"

menu:
  alert-enabled: "<prefix> <gray>Alert at <yellow><threshold></yellow> <green>enabled</green>."
  alert-disabled: "<prefix> <gray>Alert at <yellow><threshold></yellow> <red>disabled</red>."

effects:
  selected: "<success-prefix> <green>Effect <light_purple><effect></light_purple> selected."
  disabled: "<success-prefix> <green>Effect removed. You will fly without particles."
  no-permission: "<error-prefix> <red>You do not have permission to use that effect."

# Sent on join to anyone with skylease.admin.updates when a newer version exists.
update:
  available:
    - "<prefix> <gold>A new version of Skylease is available: <green><latest></green> <gray>(you have <red><current></red>)."
    - "<click:open_url:'<url>'><hover:show_text:'Open the download page'><aqua><u>Click to download it</u></aqua></hover></click>"

# Menu text. Layout (slots, materials) is in menus.yml.
menus:
  settings:
    title: "<!i><black><bold>Flight settings</bold></black>"
    player-head:
      name: "<!i><aqua><bold><player></bold></aqua>"
      lore:
        - ""
        - "<gray>Time left: <yellow><time>"
        - "<gray>Current effect: <effect>"
    alerts-button:
      name: "<!i><gold><bold>Time alerts</bold></gold>"
      lore:
        - ""
        - "<gray>Choose when you want to be told"
        - "<gray>that your time is running low."
        - ""
        - "<gold>Click to configure"
    effects-button:
      name: "<!i><color:#ff00ff><bold>Flight effects</bold></color>"
      lore:
        - ""
        - "<gray>Pick the particles that follow you"
        - "<gray>while you fly."
        - ""
        - "<gold>Click to browse the effects"
  alerts:
    title: "<!i><gold><bold>Time alerts</bold></gold>"
    # One entry shared by every threshold. <time> is the threshold, for example 5m.
    alert:
      name: "<!i><yellow>Alert: <time></yellow>"
      lore:
        - ""
        - "<gray>You will be told when"
        - "<yellow><time></yellow> <gray>of flight remain."
        - ""
        - "<gray>Status: <status>"
        - ""
        - "<gold>Click to <action>"
      enabled-status: "<green>Enabled"
      disabled-status: "<red>Disabled"
      enabled-action: "disable"
      disabled-action: "enable"
    back-button:
      name: "<!i><yellow><bold>Back</bold></yellow>"
      lore:
        - ""
        - "<gray>Return to the settings."
  effects:
    title: "<!i><gold><bold>Flight effects</bold></gold>"
    none: "<gray>None"
    current-effect:
      name: "<!i><aqua><bold>Current effect</bold></aqua>"
      lore:
        - ""
        - "<gray>You are using:"
        - "<current_effect>"
    previous-page:
      name: "<!i><yellow><bold>Previous page</bold></yellow>"
      lore:
        - ""
        - "<dark_gray>Page <current_page> of <total_pages>"
    no-previous-page:
      name: "<!i><dark_gray>First page"
      lore:
        - ""
        - "<dark_gray>Page <current_page> of <total_pages>"
    next-page:
      name: "<!i><yellow><bold>Next page</bold></yellow>"
      lore:
        - ""
        - "<dark_gray>Page <current_page> of <total_pages>"
    no-next-page:
      name: "<!i><dark_gray>Last page"
      lore:
        - ""
        - "<dark_gray>Page <current_page> of <total_pages>"
    reset-effect:
      name: "<!i><color:#ff7f00><bold>Remove effect</bold></color>"
      lore:
        - ""
        - "<gray>You will fly without particles."
        - ""
        - "<gold>Click to remove it"
    back-button:
      name: "<!i><yellow><bold>Back</bold></yellow>"
      lore:
        - ""
        - "<gray>Return to the settings."
    locked-lore:
      - ""
      - "<red>You do not have permission"
      - "<red>for this effect."
    selected-lore:
      - ""
      - "<green>Selected effect"
    available-lore:
      - ""
      - "<gold>Click to select"

